[project]
name = "pgwarden-mock-idp"
version = "0.1.0"
description = "Development-only mock OIDC identity provider for the pgwarden demo stack."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pyjwt[crypto]==2.15.0",
    "cryptography==50.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
