[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgwarden"
version = "0.1.0"
description = "Governed Postgres access for AI assistants: an MCP gateway with OAuth 2.1 and OIDC login, one Postgres role per person, database-enforced read-only queries, PII masking, human-approved writes, and a tamper-evident audit log."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Andrii Boiko" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "authlib>=1.3",
    "pyjwt[crypto]>=2.9",
    "cryptography>=42",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "asyncpg>=0.29",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mcp>=2.2,<3",
    "httpx2>=2.13",
]

[project.urls]
Homepage = "https://github.com/B0yko/pgwarden"
Issues = "https://github.com/B0yko/pgwarden/issues"

[project.scripts]
pgwarden = "pgwarden.cli:app"

[project.optional-dependencies]
bench = ["sqlglot>=25.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "asyncpg-stubs>=0.29",
    "types-authlib>=1.8.0.20260911",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pgwarden"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pgwarden"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pg: needs a real Postgres instance (PGWARDEN_TEST_ADMIN_DSN); skipped unless set, failed instead of skipped when PGWARDEN_REQUIRE_PG=1",
    "stack: needs the full docker compose stack (base URLs from .env, secrets from ./.pgwarden-dev/)",
]
