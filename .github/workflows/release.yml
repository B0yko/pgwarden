name: release

on:
  push:
    tags: ["v*"]
  # Publish an existing tag's server.json to the MCP Registry without rebuilding the image,
  # with this branch's workflow (so it also works for tags cut before this job existed):
  #   gh workflow run release.yml -R B0yko/pgwarden --ref main -f tag=v0.1.1
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose server.json to publish, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/b0yko/pgwarden
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk "/^## \\[$version\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "${notes:-Release $GITHUB_REF_NAME}"

  # A job here, not a separate `on: release` workflow: a release created with GITHUB_TOKEN
  # triggers no other workflow. It runs after the image push because the registry checks the
  # image's io.modelcontextprotocol.server.name label against server.json.
  mcp-registry:
    runs-on: ubuntu-latest
    needs: image
    if: ${{ !cancelled() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.image.result == 'skipped')) }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry; no stored secret
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MCP_PUBLISHER_VERSION: v1.8.10
      # sha256 of mcp-publisher_linux_amd64.tar.gz, from registry_1.8.10_checksums.txt
      MCP_PUBLISHER_SHA256: 32d287ed6fb7dc04eddd2621097784c06a355b2348b35ccc630a1643aa75ff4a
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check that server.json names this tag's version
        run: |
          want="${TAG#v}"
          got="$(jq -r .version server.json)"
          image="$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)"
          test "$got" = "$want" || { echo "server.json version $got != tag $want" >&2; exit 1; }
          test "$image" = "ghcr.io/b0yko/pgwarden:$want" || { echo "server.json image $image" >&2; exit 1; }
      - name: Download mcp-publisher (pinned, checksum verified)
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
      - name: Read the entry back
        run: |
          want="${TAG#v}"
          for _ in 1 2 3 4 5 6; do
            got="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.B0yko/pgwarden&version=latest" \
              | jq -r '.servers[] | select(.server.name == "io.github.B0yko/pgwarden") | .server.version')"
            if [ "$got" = "$want" ]; then echo "registry lists $got"; exit 0; fi
            sleep 10
          done
          echo "registry shows '${got}', expected ${want}" >&2
          exit 1
