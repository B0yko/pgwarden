name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --extra bench
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict src/
      - run: uv run pgwarden report --check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported major and the newest stable major.
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      PGWARDEN_REQUIRE_PG: "1"
      PGWARDEN_TEST_ADMIN_DSN: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --extra bench
      - name: Unit and integration tests (no docker-in-service marker)
        run: uv run pytest -m "not stack" -q

  stack:
    runs-on: ubuntu-latest
    env:
      PGWARDEN_REQUIRE_STACK: "1"
      PGWARDEN_RUN_DATE: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --extra bench
      - name: Bring up the demo stack
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Stack tests
        run: uv run pytest -m stack -q
      - name: Red-team gate (100% must-block, 100% benign)
        env:
          PGWARDEN_CONFIG: demo/pgwarden.yaml
        run: |
          export PGWARDEN_ADMIN_DSN="$(sed 's#/postgres?#/shop?#' .pgwarden-dev/admin/admin_dsn)"
          # the state-DB oracles reach the target DB over the published port
          export PGWARDEN_ADMIN_DSN="$(sed 's#@postgres:5432#@127.0.0.1:5432#' <<< "$PGWARDEN_ADMIN_DSN")"
          export PGWARDEN_MACHINE_SECRET="$(cat .pgwarden-dev/machines/machine-nightly-report)"
          uv run pgwarden redteam run --target-url http://localhost:8080 --hardware "GitHub Actions ubuntu-latest"
      - name: Baselines and audit chain
        run: uv run pgwarden bench baselines
      - name: Show gateway logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

  own-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      PGWARDEN_REQUIRE_PG: "1"
      OWN_DB_ADMIN_DSN: postgresql://postgres:ci-postgres-password@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync
      - name: Follow docs/own-database.md against a plain Postgres 16
        run: uv run pytest tests/own_database -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: fmt, validate, test, tflint, trivy (pinned images)
        run: deploy/terraform/check.sh
