name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --extra bench
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict src/
      - run: uv run pgwarden report --check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported major and the newest stable major.
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      PGWARDEN_REQUIRE_PG: "1"
      PGWARDEN_TEST_ADMIN_DSN: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --extra bench
      - name: PgBouncer in transaction mode (the fixture for the doctor's pooler check)
        run: |
          password="$(uv run python -c "import tests.conftest as c; from pgwarden.db.scram import derive_password; print(derive_password(c.TEST_ROLE_SECRET, 'pw_u_alice'))")"
          docker run -d --name pgwarden-testbouncer \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:55434:5432 \
            -e DATABASE_URL="postgresql://pw_u_alice:${password}@host.docker.internal:5432/pgw_shop" \
            -e AUTH_TYPE=plain -e POOL_MODE=transaction -e DEFAULT_POOL_SIZE=1 \
            -e MAX_CLIENT_CONN=100 -e SERVER_IDLE_TIMEOUT=5 \
            edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/55434) 2>/dev/null && exit 0
            sleep 1
          done
          docker logs pgwarden-testbouncer
          exit 1
      - name: Unit and integration tests (no docker-in-service marker)
        run: uv run pytest -m "not stack" -q

  stack:
    runs-on: ubuntu-latest
    env:
      PGWARDEN_REQUIRE_STACK: "1"
      PGWARDEN_RUN_DATE: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --extra bench
      - name: Bring up the demo stack
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Chromium for the MCP Inspector OAuth check
        run: uv run playwright install --with-deps chromium
      - name: Stack tests
        run: uv run pytest -m stack -q
      - name: Red-team gate (100% must-block, 100% benign)
        env:
          PGWARDEN_CONFIG: demo/pgwarden.yaml
        run: |
          export PGWARDEN_ADMIN_DSN="$(sed 's#/postgres?#/shop?#' .pgwarden-dev/admin/admin_dsn_host)"
          # the state DSN lets the run clear its own rate windows: the stack tests above
          # already used this hour's proposal budget
          export PGWARDEN_STATE_DSN="$(cat .pgwarden-dev/host/state_dsn_host)"
          export PGWARDEN_MACHINE_SECRET="$(cat .pgwarden-dev/machines/machine-nightly-report)"
          uv run pgwarden redteam run --allow-load --target-url http://localhost:8080 --hardware "GitHub Actions ubuntu-latest"
      - name: Statement-filter baselines
        run: uv run pgwarden bench baselines
      - name: Audit chain verification after the suite
        run: docker compose exec -T gateway pgwarden audit verify
      - name: Show gateway logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

  own-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      PGWARDEN_REQUIRE_PG: "1"
      OWN_DB_ADMIN_DSN: postgresql://postgres:ci-postgres-password@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync
      - name: Follow docs/own-database.md against a plain Postgres 16
        run: uv run pytest tests/own_database -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: fmt, validate, test, tflint, trivy (pinned images)
        run: deploy/terraform/check.sh
