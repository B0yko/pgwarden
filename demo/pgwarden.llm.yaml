# LLM-run profile: the demo config with raised rate limits for `pgwarden redteam llm`
# (10 tasks x 3 trials x 2 models). The README notes this profile.
public_url: ${PGWARDEN_PUBLIC_URL:-http://localhost:8080}
demo:
  enabled: true
upstream:
  name: mock-idp
  preset: oidc
  issuer: ${PGWARDEN_OIDC_ISSUER:-http://localhost:9400}
  discovery_url: http://mock-idp:9400/.well-known/openid-configuration
  client_id: pgwarden-demo
  scopes:
  - openid
  - email
  - profile
people:
- identity:
    email: alice@example.com
  role: alice
  bundles:
  - analyst
- identity:
    email: bob@example.com
  role: bob
  bundles:
  - support
  writer: support_writer
- identity:
    email: dana@example.com
  role: dana
  bundles:
  - support
  writer: support_writer
machines:
- name: nightly-report
  role: nightly_report
  bundles:
  - reporting
approvers:
- email: carol@example.com
admins:
- email: carol@example.com
masking:
  columns:
    public.customers.full_name: name
    public.customers.email: email
    public.customers.phone: phone
  view_grants:
    public.customers:
    - analyst
    - reporting
  raw_access_bundles:
  - support
rls_required:
- public.customers
- public.orders
- public.support_tickets
- public.ticket_notes
- public.refunds
notifications:
  channels:
  - log
  - smtp
  smtp_from: pgwarden@example.com
limits:
  queries_per_minute: 600
  proposals_per_hour: 600
  registrations_per_hour: 600
