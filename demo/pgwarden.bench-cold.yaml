# Cold-start benchmark profile: exactly demo/pgwarden.bench.yaml plus one field, a pool
# idle timeout of 1 second, so that a pooled connection is evicted during a short pause
# and the next call pays connect + SCRAM. Used only by `pgwarden bench cold`.
# A unit test keeps this file equal to the bench profile except for `pool`.
public_url: ${PGWARDEN_PUBLIC_URL:-http://localhost:8080}
demo:
  enabled: true
upstream:
  name: mock-idp
  preset: oidc
  issuer: ${PGWARDEN_OIDC_ISSUER:-http://localhost:9400}
  discovery_url: http://mock-idp:9400/.well-known/openid-configuration
  client_id: pgwarden-demo
  scopes:
  - openid
  - email
  - profile
